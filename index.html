<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>task mannager</title>
  </head>
  <body>
    <form>
      <div class="input-field">
        <label for="name-input">Task Name</label>
        <input type="text" id="name-input" />
      </div>
      <div class="input-field">
        <label for="level-input">Difficulty Level</label>
        <select id="level-input">
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
      <div class="input-field">
        <label for="time-input">estimated minutes</label
        ><input id="time-input" type="number" />
      </div>
      <input type="submit" class="submit-btn" value="Submit" />
    </form>

    <div class="statistics-wraper">
      <div class="statistics">
        <div>
          <p>total tasks:</p>
          <span>0</span>
        </div>
        <div>
          <p>completed tasks: 0</p>
          <span>0</span>
        </div>
        <div>
          <p>remaining tasks: 0</p>
          <span>0</span>
        </div>
        <div>
          <p>total planned minutes: 0</p>
          <span>0</span>
        </div>
      </div>
      <button class="reset-all">Reset All</button>
    </div>

    <div class="tasks-container"></div>

    <script src="script.js" type="module"></script>
  </body>
</html>
